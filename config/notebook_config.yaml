models:
  roi_model_path: "C:/Users/mzinn1/Desktop/Scripts/GCaMP-Analysis/models/combined_roi_classifier.joblib"
  roi_config_path: "C:/Users/mzinn1/DesktopScripts/GCaMP-Analysis/models/combined_roi_classifier_results.json"
  spike_model_path: "C:/Users/mzinn1/Desktop/gcamp_model/spike_classifier.joblib"
  spike_config_path: "C:/Users/mzinn1/Desktop/gcamp_model/spike_classifier_results.json"
  cascade_model_name: "Global_EXC_30Hz_smoothing100ms_high_noise"
  cascade_model_dir: "Cascade/Pretrained_models"
traces: 
  smooth_sigma: 4.0
  sensor_type: "gcamp8s"   # gcamp8s, gcamp6f, or generic
hp_tuning: 
  model_searches:
    RF:
      n_estimators: [50, 100, 200, 300]
      max_depth: [null, 5, 10, 20, 30]
      min_samples_split: [2, 5, 10]
      min_samples_leaf: [1, 2, 4]
      class_weight: ["balanced", null]

    LR:
      C: [0.01, 0.1, 1, 10, 100]
      penalty: ["l1", "l2"]
      solver: ["liblinear", "saga"]
      max_iter: [200, 500, 1000]
      class_weight: ["balanced", null]

    SVC:
      C: [0.1, 1, 10, 100]
      kernel: ["rbf", "linear", "poly"]
      gamma: ["scale", "auto", 0.01, 0.1]
      class_weight: ["balanced", null]
  
  base_models: 
    RF:
      random_state: 42

    LR:
      random_state: 42

    SVC:
      random_state: 42
      probability: true

grouping:
  strategies: ["corr", "louvain"]  # Add louvain to the list
  louvain:
    trace: "norm_sm_f"
    method: "pearson"
    resolution: 1.0        # Higher = more/smaller groups, lower = fewer/larger
    edge_threshold: 0.7    # Only connect neurons with corr > this
    min_group_size: 2
    remove_global: true
    zscore_each: true
    clip_negatives: true
  sttc:
    time_window: .4       # 33ms, 50ms, 100ms, 200ms, 300ms
    correlation_threshold: 0.1
    linkage_method: "average"
    distance_threshold: 0.2
    min_group_size: 2
  corr:
    trace: "norm_sm_f"  
    method: "pearson"
    remove_global: true
    use_diff: False
    diff_order: 2
    zscore_each: true
    clip_negatives: true
    distance_threshold: 0.15
    min_group_size: 2
    window : 10
    polyorder: 2

  