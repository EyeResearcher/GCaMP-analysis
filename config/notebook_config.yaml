grouping:
  sttc:
    time_window: .4       # 33ms, 50ms, 100ms, 200ms, 300ms
    correlation_threshold: 0.1
    linkage_method: "average"
    distance_threshold: 0.2
    min_group_size: 2
  corr:
    trace: "norm_sm_f"
    method: "pearson"
    remove_global: true
    use_diff: true
    diff_order: 1
    zscore_each: true
    clip_negatives: true
    distance_threshold: 0.2
    min_group_size: 2

  