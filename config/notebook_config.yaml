models:
  roi_model_path: "C:/Users/mzinn1/Desktop/gcamp_model/roi_classifier_20260122_142743.joblib"
  spike_model_path: "C:/Users/mzinn1/Desktop/gcamp_model/spike_classifier_20260123_011301.joblib"   
  cascade_model_name: "Global_EXC_30Hz_smoothing100ms_high_noise"
  cascade_model_dir: "Cascade/Pretrained_models"

hp_tuning: 
  model_searches:
    RandomForestClassifier:
      n_estimators: [50, 100, 200, 300]
      max_depth: [null, 5, 10, 20, 30]
      min_samples_split: [2, 5, 10]
      min_samples_leaf: [1, 2, 4]
      class_weight: ["balanced", null]

    LogisticRegression:
      C: [0.01, 0.1, 1, 10, 100]
      penalty: ["l1", "l2"]
      solver: ["liblinear", "saga"]
      max_iter: [200, 500, 1000]
      class_weight: ["balanced", null]

    SVC:
      C: [0.1, 1, 10, 100]
      kernel: ["rbf", "linear", "poly"]
      gamma: ["scale", "auto", 0.01, 0.1]
      class_weight: ["balanced", null]
  
  base_models: 
    RandomForestClassifier: 
      random_state: 42

    LogisticRegression:
      random_state: 42

    SVC:
      random_state: 42
      probability: true

grouping:
  sttc:
    time_window: .4       # 33ms, 50ms, 100ms, 200ms, 300ms
    correlation_threshold: 0.1
    linkage_method: "average"
    distance_threshold: 0.2
    min_group_size: 2
  corr:
    trace: "norm_sm_f"
    method: "pearson"
    remove_global: true
    use_diff: true
    diff_order: 1
    zscore_each: true
    clip_negatives: true
    distance_threshold: 0.2
    min_group_size: 2

  