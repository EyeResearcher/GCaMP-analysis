traces: 
  smooth_sigma: 1
  sensor_type: "gcamp6s"   # gcamp8s, gcamp6f, or generic

# Keep notebook execution memory-stable. The pipeline otherwise defaults to
# n_jobs=-1, which starts one Joblib worker per logical CPU in two stages.
parallel:
  n_jobs: 1

hp_tuning: 
  model_searches:
    RF:
      n_estimators: [50, 100, 200, 300]
      max_depth: [null, 5, 10, 20, 30]
      min_samples_split: [2, 5, 10]
      min_samples_leaf: [1, 2, 4]
      class_weight: ["balanced", null]

    LR:
      C: [0.01, 0.1, 1, 10, 100]
      penalty: ["l1", "l2"]
      solver: ["liblinear", "saga"]
      max_iter: [200, 500, 1000]
      class_weight: ["balanced", null]

    SVC:
      C: [0.1, 1, 10, 100]
      kernel: ["rbf", "linear", "poly"]
      gamma: ["scale", "auto", 0.01, 0.1]
      class_weight: ["balanced", null]
  
  base_models: 
    RF:
      random_state: 42

    LR:
      random_state: 42

    SVC:
      random_state: 42
      probability: true
grouping:
  strategies: ["corr","wcorr", "sttc", "light-evoked", "combined"]  # any combination of: corr, sttc, dtw
  combined:
    enabled: False
    corr:
      max_lag: 5
    sttc:
      dt: 1.75
    cluster:
      linkage_method: "average"
      cluster_criterion: "distance"
      cluster_param: 0.5
      min_group_size: 2
  sttc:
    enabled: False
    time_window: .4       # 33ms, 50ms, 100ms, 200ms, 300ms
    correlation_threshold: 0.1
    linkage_method: "average"
    distance_threshold: 0.2
    min_group_size: 2
  corr:
    enabled: false
    trace: "norm_sm_f"  
    method: "pearson"
    cluster : "hierarchical"
    linkage_method: "complete"
    remove_global: False
    use_diff: False
    diff_order: 2
    zscore_each: true
    clip_negatives: true
    distance_threshold: 0.15
    min_group_size: 2
    window : 10
    polyorder: 2
  wcorr:
    enabled: false
    trace: "norm_sm_f"  
    method: "weighted_pearson"
    cluster : "hierarchical"
    linkage_method: "average"
    remove_global: true
    use_diff: False
    diff_order: 2
    zscore_each: true
    clip_negatives: true
    distance_threshold: 0.15
    min_group_size: 2
    window : 10
    polyorder: 2
  light-evoked:
    enabled: True
    start: 30 
    interval : 30
    bin_size : 2
    schedule : 

concatenated:
  enabled: False          # set true for concatenated baseline+treatment videos
  split_frame: 3651       # frame index where baseline ends and treatment begins
  
